<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias</title>
    <link rel="stylesheet" href="css/expansivel.css">
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
</head>
<body>
        <header>
            <h1>Elementos MultiMídia</h1>
        </header>
              <nav>
                <a href="conteudo-expansivel.html">Exemplo details/summary</a>
                <a href="midias.html">Exemplo mídias</a>
            </nav>

        <main>
            <p class="introducao">
                O HTML5 permite trabalhar com diferentes tipos de mídia para audio e video, além de conteído externo
            </p>

                <section>
                    <h2>Aúdio</h2>
                        <div class="caixa-midia">
                            <audio controls>
                                <source src="multimidia/judas-priest.mp3" type="audio/mpeg">
                                <source src="multimidia/judas-priest.ogg" type="audio/ogg">
                            </audio>
                        </div>
                </section>

                <section>
                    <h2>Vídeos</h2>
                    <div class="caixa-midia">
                        <video controls>
                            <source src="multimidia/pink-floyd.mp4" type="video/mpeg">
                            <source src="multimidia/pink-floyd.webm" type="video/webm">
                            <track src="multimidia/legenda.vtt" kind="subtitles" srclang="eng"></track>
                        </video>
                    </div>
                </section>

                <section>
                    <h2>Vídeo do Youtube usando a tag iframe</h2>
                        <div class="caixa-midia">
                            <iframe width="560" height="315" src="https://www.youtube.com/embed/kcjEOsxg1FY?si=Qt8TtksUfQQVTEg8" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                        </div>
                </section>
        </main>
</body>
</html>
